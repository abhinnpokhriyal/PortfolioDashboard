name: Commitlint

on:
  pull_request:
    branches: [main, release_01]

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Validate commits
        run: npx commitlint --from=origin/main --to=HEAD --verbose
